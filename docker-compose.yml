name: turnos
services:
  postgresql:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: turnos
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - 127.0.0.1:5433:5432
    volumes:
      - turnos-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d turnos']
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  turnos-db:
